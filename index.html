<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bank & MFS Automation</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --credit: #10b981;
      --debit: #ef4444;
      --accent: #3b82f6;
      --gold: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 40px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10b981;
    }
    .dot.offline { background-color: #ef4444; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .stat-value {
      font-size: 1.15rem;
      font-weight: 800;
    }
    .stat-value.balance { color: #38bdf8; }
    .stat-value.commission { color: var(--gold); }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tx-type-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .tx-type-btn {
      padding: 12px;
      border-radius: 10px;
      border: 2px solid transparent;
      background: #0f172a;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tx-type-btn.active-credit {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--credit);
      color: var(--credit);
    }
    .tx-type-btn.active-debit {
      background: rgba(239, 68, 68, 0.15);
      border-color: var(--debit);
      color: var(--debit);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      font-size: 1.1rem;
      color: #fff;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
    }
    .btn-submit.credit-mode { background: var(--credit); }
    .btn-submit.debit-mode { background: var(--debit); }

    .output-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 2px dashed var(--accent);
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
    }
    .output-card:active { transform: scale(0.98); }
    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .output-title {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
    }
    .copy-badge {
      font-size: 0.7rem;
      background: var(--accent);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .output-text {
      font-family: monospace;
      font-size: 1.05rem;
      line-height: 1.5;
      white-space: pre-wrap;
      color: #fff;
      background: rgba(0,0,0,0.3);
      padding: 12px;
      border-radius: 8px;
    }

    .action-row {
      display: flex;
      gap: 8px;
    }
    .btn-secondary {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }
    .counter-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .counter-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .counter-name { font-size: 0.9rem; font-weight: 600; }
    .counter-reset-tag { font-size: 0.65rem; color: var(--text-muted); }
    .counter-actions { display: flex; align-items: center; gap: 8px; }
    .counter-input { width: 65px !important; padding: 6px !important; text-align: center; }
    .btn-plus {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      width: 38px;
      height: 38px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-del { background: transparent; border: none; color: #64748b; font-size: 1.1rem; cursor: pointer; padding: 4px; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--credit);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      transition: transform 0.3s;
      z-index: 999;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="app-container">
  <div class="status-bar">
    <span>Bank & MFS Automation</span>
    <div class="status-badge">
      <span class="dot" id="netDot"></span>
      <span id="netStatus">Connecting...</span>
    </div>
  </div>

  <!-- Real-time Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total Account Balance</div>
      <div class="stat-value balance" id="displayBalance">0.00 BDT</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Commission</div>
      <div class="stat-value commission" id="displayCommission">0.00 BDT</div>
    </div>
  </div>

  <!-- Entry Form -->
  <div class="card">
    <div class="tx-type-selector">
      <button class="tx-type-btn active-credit" id="btnTypeCredit" onclick="setType('CREDIT')">Credit (Deposit)</button>
      <button class="tx-type-btn" id="btnTypeDebit" onclick="setType('DEBIT')">Debit (Withdraw)</button>
    </div>

    <div class="input-group">
      <label for="amountInput">Amount (BDT)</label>
      <input type="number" step="any" inputmode="decimal" id="amountInput" placeholder="e.g. 1000 or 505.51">
    </div>

    <div class="input-group" id="commissionGroup" style="display: none;">
      <label for="commissionRateInput">Commission Rate (%)</label>
      <input type="number" step="any" inputmode="decimal" id="commissionRateInput" value="0.5">
    </div>

    <button class="btn-submit credit-mode" id="submitBtn" onclick="processTransaction()">
      Process Credit
    </button>
  </div>

  <!-- 1-Click Copy Output Box -->
  <div class="output-card" onclick="copyOutputText()">
    <div class="output-header">
      <span class="output-title">Output Result</span>
      <span class="copy-badge" id="copyBadge">Click to Copy</span>
    </div>
    <div class="output-text" id="outputText">Ready for transactions.</div>
  </div>

  <!-- Undo Button -->
  <div class="action-row">
    <button class="btn-secondary" onclick="undoLastTransaction()">↶ Undo Last Transaction</button>
  </div>

  <!-- Monthly Counters -->
  <div class="section-title">
    <span>Monthly Counters (Resets on 1st)</span>
    <button class="btn-secondary" style="flex:0; padding:6px 12px;" onclick="addCounterPrompt()">+ Add</button>
  </div>
  <div class="counter-list" id="counterList"></div>
</div>

<div class="toast" id="toast">Copied to Clipboard! ✓</div>

<!-- Modular Firebase Script -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { 
    initializeFirestore, 
    persistentLocalCache, 
    persistentMultipleTabManager,
    collection, 
    addDoc, 
    doc, 
    setDoc, 
    deleteDoc, 
    updateDoc, 
    onSnapshot, 
    query, 
    orderBy 
  } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  // Your Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyD6q6RszdjEkLK8yutRzuuDEMfPb8fAOpA",
    authDomain: "bank-t.firebaseapp.com",
    databaseURL: "https://bank-t-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bank-t",
    storageBucket: "bank-t.firebasestorage.app",
    messagingSenderId: "667453888081",
    appId: "1:667453888081:web:07c50969204fed29ce8a70",
    measurementId: "G-HY9W096NXZ"
  };

  // Initialize App with Multi-Tab Offline Cache
  const app = initializeApp(firebaseConfig);
  const db = initializeFirestore(app, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
  });

  const txCollection = collection(db, "transactions");
  const counterCollection = collection(db, "counters");

  let currentType = 'CREDIT';
  let balance = 0.00;
  let totalCommission = 0.00;
  let transactionList = [];
  let counters = [];

  // Network State
  function updateNetStatus() {
    const isOnline = navigator.onLine;
    document.getElementById('netDot').className = isOnline ? 'dot' : 'dot offline';
    document.getElementById('netStatus').innerText = isOnline ? 'Online (Synced)' : 'Offline (Saved Locally)';
  }
  window.addEventListener('online', updateNetStatus);
  window.addEventListener('offline', updateNetStatus);
  updateNetStatus();

  // Number Formatter (e.g., 1,000.00 BDT)
  function formatBDT(num) {
    const isNeg = num < 0;
    const parts = Math.abs(num).toFixed(2).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (isNeg ? "-" : "") + parts.join('.') + " BDT";
  }

  // Type Switcher
  window.setType = function(type) {
    currentType = type;
    const btnCredit = document.getElementById('btnTypeCredit');
    const btnDebit = document.getElementById('btnTypeDebit');
    const comGroup = document.getElementById('commissionGroup');
    const submitBtn = document.getElementById('submitBtn');

    if (type === 'CREDIT') {
      btnCredit.className = 'tx-type-btn active-credit';
      btnDebit.className = 'tx-type-btn';
      comGroup.style.display = 'none';
      submitBtn.className = 'btn-submit credit-mode';
      submitBtn.innerText = 'Process Credit';
    } else {
      btnDebit.className = 'tx-type-btn active-debit';
      btnCredit.className = 'tx-type-btn';
      comGroup.style.display = 'flex';
      submitBtn.className = 'btn-submit debit-mode';
      submitBtn.innerText = 'Process Debit';
    }
  };

  // Real-time listener for Transactions (Sums and Syncs from all devices)
  const txQuery = query(txCollection, orderBy("createdAt", "asc"));
  onSnapshot(txQuery, { includeMetadataChanges: true }, (snapshot) => {
    let sumBalance = 0;
    let sumCommission = 0;
    transactionList = [];

    snapshot.forEach(docSnap => {
      const data = docSnap.data();
      data.id = docSnap.id;
      transactionList.push(data);

      if (data.type === 'CREDIT') {
        sumBalance += data.amount;
      } else {
        sumBalance -= (data.amount + data.commission);
        sumCommission += data.commission;
      }
    });

    balance = sumBalance;
    totalCommission = sumCommission;
    document.getElementById('displayBalance').innerText = formatBDT(balance);
    document.getElementById('displayCommission').innerText = formatBDT(totalCommission);
  });

  // Monthly Reset Check for Counters
  const currentMonthKey = `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}`;

  onSnapshot(counterCollection, (snapshot) => {
    counters = [];
    snapshot.forEach(docSnap => {
      const data = docSnap.data();
      data.id = docSnap.id;

      // Auto-reset check for 1st of month
      if (data.lastResetMonth !== currentMonthKey) {
        updateDoc(doc(counterCollection, data.id), {
          value: 0,
          lastResetMonth: currentMonthKey
        });
        data.value = 0;
      }
      counters.push(data);
    });
    renderCounters();
  });

  // Process Transaction
  window.processTransaction = async function() {
    const input = document.getElementById('amountInput');
    const amount = parseFloat(input.value);

    if (isNaN(amount) || amount <= 0) {
      alert("Please enter a valid amount");
      return;
    }

    let commission = 0;
    if (currentType === 'DEBIT') {
      const rate = parseFloat(document.getElementById('commissionRateInput').value) || 0;
      commission = amount * (rate / 100);
    }

    const nextBalance = currentType === 'CREDIT' 
      ? balance + amount 
      : balance - (amount + commission);

    const generatedText = `${currentType === 'CREDIT' ? 'Credited' : 'Debited'}: ${formatBDT(amount)}\nBalance: ${formatBDT(nextBalance)}`;
    document.getElementById('outputText').innerText = generatedText;
    localStorage.setItem('bkm_last_output', generatedText);

    // Save to Firestore (Queues automatically if offline)
    await addDoc(txCollection, {
      type: currentType,
      amount: amount,
      commission: commission,
      createdAt: Date.now()
    });

    input.value = '';
    window.copyOutputText();
  };

  // 1-Click Copy
  window.copyOutputText = function() {
    const text = document.getElementById('outputText').innerText;
    if (!text || text.startsWith("Ready")) return;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text);
    }
    const toast = document.getElementById('toast');
    const badge = document.getElementById('copyBadge');
    toast.classList.add('show');
    badge.innerText = 'Copied! ✓';
    setTimeout(() => {
      toast.classList.remove('show');
      badge.innerText = 'Click to Copy';
    }, 1500);
  };

  // Undo Last Transaction
  window.undoLastTransaction = async function() {
    if (transactionList.length === 0) {
      alert("No transaction to undo!");
      return;
    }
    const last = transactionList[transactionList.length - 1];
    if (confirm(`Undo last ${last.type} of ${formatBDT(last.amount)}?`)) {
      await deleteDoc(doc(txCollection, last.id));
      document.getElementById('outputText').innerText = "Last transaction undone.";
    }
  };

  // Counter UI & Logic
  function renderCounters() {
    const list = document.getElementById('counterList');
    list.innerHTML = '';
    if (counters.length === 0) {
      list.innerHTML = '<div style="color: var(--text-muted); font-size: 0.8rem; text-align: center; padding: 8px;">No active counters. Click "+ Add" to create one.</div>';
      return;
    }

    counters.forEach(item => {
      const div = document.createElement('div');
      div.className = 'counter-item';
      div.innerHTML = `
        <div>
          <div class="counter-name">${item.name}</div>
          <div class="counter-reset-tag">Auto-resets 1st of month</div>
        </div>
        <div class="counter-actions">
          <input type="number" class="counter-input" value="${item.value}" onchange="updateCounterValue('${item.id}', this.value)">
          <button class="btn-plus" onclick="incrementCounter('${item.id}', ${item.value})">+1</button>
          <button class="btn-del" onclick="deleteCounter('${item.id}')">✕</button>
        </div>
      `;
      list.appendChild(div);
    });
  }

  window.addCounterPrompt = async function() {
    const name = prompt("Enter Counter Profile Name (e.g. Bkash, Nagad):");
    if (name && name.trim()) {
      await addDoc(counterCollection, {
        name: name.trim(),
        value: 0,
        lastResetMonth: currentMonthKey
      });
    }
  };

  window.incrementCounter = async function(id, curVal) {
    await updateDoc(doc(counterCollection, id), { value: (curVal || 0) + 1 });
  };

  window.updateCounterValue = async function(id, newVal) {
    await updateDoc(doc(counterCollection, id), { value: parseInt(newVal) || 0 });
  };

  window.deleteCounter = async function(id) {
    if (confirm("Delete this counter profile?")) {
      await deleteDoc(doc(counterCollection, id));
    }
  };

  // Restore previous output
  const lastOutput = localStorage.getItem('bkm_last_output');
  if (lastOutput) document.getElementById('outputText').innerText = lastOutput;

  // Keyboard shortcut Enter
  document.getElementById('amountInput').addEventListener('keyup', (e) => {
    if (e.key === 'Enter') window.processTransaction();
  });
</script>
</body>
</html>
